<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>

<style>
  /* Brand typography for MDX docs pages only.
     Selectors are anchored to direct children of `.sbdocs-content`: that is
     where Markdown-rendered elements land. Component previews sit deeper,
     inside `.docs-story`, and the Introduction hero opts out with
     `.sb-unstyled`, so neither is touched. */
  .sbdocs-content {
    --sb-brand-ink: #141414;
    --sb-brand-ink-soft: #2b2b2b;
    --sb-brand-muted: #666666;
    --sb-brand-line: #e5e5e5;
    --sb-brand-signal: #c8201b;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .sbdocs-content > :is(h1, h2, h3, h4) {
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif !important;
    color: var(--sb-brand-ink) !important;
    font-weight: 600 !important;
    text-wrap: balance;
    border: 0 !important;
  }
  .sbdocs-content > h1 { font-size: 2.75rem !important; line-height: 1.05 !important; letter-spacing: -0.04em !important; }
  .sbdocs-content > h2 {
    font-size: 1.75rem !important;
    line-height: 1.15 !important;
    letter-spacing: -0.03em !important;
    margin-top: 4rem !important;
    padding-top: 2rem !important;
    border-top: 1px solid var(--sb-brand-line) !important;
  }
  .sbdocs-content > h3 { font-size: 1.25rem !important; letter-spacing: -0.02em !important; margin-top: 2.5rem !important; }

  .sbdocs-content > :is(p, ul, ol, blockquote, table) {
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif !important;
  }
  .sbdocs-content > p,
  .sbdocs-content > :is(ul, ol) li {
    font-size: 15px !important;
    line-height: 1.7 !important;
    color: var(--sb-brand-ink-soft) !important;
    max-width: 70ch;
  }
  /* app.css's Tailwind preflight strips list markers; restore them for prose. */
  .sbdocs-content > ol { list-style: decimal !important; padding-left: 1.5rem !important; }
  .sbdocs-content > ol > li::marker {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 12px;
    color: var(--sb-brand-muted);
  }

  /* Storybook stripes Markdown tables with a hardcoded cool gray (#F6F9FC,
     `theme.color.lighter`) that no theme option reaches. Use a neutral grey. */
  .sbdocs-content > table tr:nth-of-type(2n) {
    background-color: #fafafa;
  }

  .sbdocs-content > table th {
    font-family: 'Geist Mono', ui-monospace, monospace !important;
    font-size: 11px !important;
    font-weight: 500 !important;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sb-brand-muted) !important;
  }

  .sbdocs-content > :is(p, ul, ol, table, blockquote) a {
    color: var(--sb-brand-ink) !important;
    text-decoration: underline !important;
    text-decoration-color: color-mix(in srgb, var(--sb-brand-signal) 45%, transparent) !important;
    text-decoration-thickness: 1.5px !important;
    text-underline-offset: 3px;
    transition: text-decoration-color 240ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  .sbdocs-content > :is(p, ul, ol, table, blockquote) a:hover {
    text-decoration-color: var(--sb-brand-signal) !important;
  }

  .sbdocs-content > :is(p, ul, ol, table) code {
    font-family: 'Geist Mono', ui-monospace, monospace !important;
    font-size: 0.86em !important;
    background: #f4f4f4 !important;
    border: 1px solid var(--sb-brand-line) !important;
    border-radius: 5px !important;
    padding: 0.1em 0.4em !important;
  }
</style>
