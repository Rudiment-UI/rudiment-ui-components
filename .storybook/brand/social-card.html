<!doctype html>
<!--
  Social share card (Open Graph / Twitter / LinkedIn / messengers), 1200×630.
  Source for .storybook/public/social-card.png. Regenerate with
  `npm run build:social-card` after editing. Colors and type follow BRAND.md.
  Key content stays inside the centered 630×630 square too, so messengers that
  crop to a square (WhatsApp, iMessage thumbnails) still show the mark and
  the headline's first words.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  :root {
    --night: #0e0e0e;
    --night-raised: #171717;
    --night-line: #2b2b2b;
    --night-muted: #9a9a9a;
    --canvas: #f5f5f5;
    --ink: #141414;
    --red: #e5322d;
    --red-bright: #ff5a4f;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: var(--night);
    color: var(--canvas);
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Faint 8-unit field grid that bleeds off the card. */
  .field {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(245,245,245,0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(245,245,245,0.035) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: -1px -1px;
    mask-image: radial-gradient(120% 120% at 78% 50%, #000 30%, transparent 75%);
  }

  .card {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 430px;
    gap: 40px;
    height: 100%;
    padding: 64px 72px 60px;
  }

  .copy { display: flex; flex-direction: column; }

  .lockup { display: flex; align-items: center; gap: 14px; }
  .lockup svg { display: block; }
  .word { font-size: 28px; font-weight: 600; letter-spacing: -0.035em; }
  .sub {
    margin-left: -9px; transform: translateY(2px);
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 17px; font-weight: 500; color: var(--night-muted);
  }

  h1 {
    margin-top: auto;
    font-size: 92px;
    font-weight: 600;
    line-height: 0.96;
    letter-spacing: -0.055em;
  }
  .point { color: var(--red); }

  .lede {
    margin-top: 26px;
    max-width: 30ch;
    font-size: 25px;
    line-height: 1.4;
    letter-spacing: -0.01em;
    color: #c9c9c9;
  }

  .facts {
    display: flex; gap: 28px;
    margin-top: 34px;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--night-muted);
  }
  .facts span { display: inline-flex; align-items: center; gap: 10px; }
  .facts span::before {
    content: ''; width: 6px; height: 6px; border-radius: 999px; background: var(--red);
  }

  /* Construction plate: the mark on its 32-unit grid. */
  .plate {
    align-self: center;
    position: relative;
    aspect-ratio: 1;
    border-radius: 36px;
    background: var(--night-raised);
    box-shadow: inset 0 0 0 1px var(--night-line), 0 40px 80px -40px rgba(0,0,0,0.8);
    display: grid; place-items: center;
  }
  .plate svg { width: 88%; height: 88%; overflow: visible; }
  .grid { stroke: rgba(245,245,245,0.07); stroke-width: 0.05; }
  .grid--major { stroke: rgba(245,245,245,0.16); }
  .guide { fill: none; stroke: var(--red-bright); stroke-width: 0.07; stroke-dasharray: 0.35 0.3; opacity: 0.7; }
  .glyph { fill: var(--canvas); }
  .mark-point { fill: var(--red); }
  .labels text {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 1.05px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; fill: var(--night-muted);
  }
</style>
</head>
<body>
  <div class="field" aria-hidden="true"></div>
  <main class="card">
    <section class="copy">
      <div class="lockup">
        <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#F5F5F5"/><path fill="#141414" d="M9 9h4v14H9zM13 9h4a6 6 0 0 1 6 6h-4a2 2 0 0 0-2-2h-4z"/><circle cx="20.5" cy="20.5" r="2.5" fill="#E5322D"/></svg>
        <span class="word">rudiment</span><span class="sub">/ui</span>
      </div>

      <h1>Build from<br />the rudiments<span class="point">.</span></h1>
      <p class="lede">Accessible React components on React Aria, themed entirely by design tokens.</p>

      <div class="facts">
        <span>8 themes</span>
        <span>0 global resets</span>
        <span>Agent-readable API</span>
      </div>
    </section>

    <figure class="plate">
      <svg viewBox="-2 -2 36 36" aria-hidden="true">
        <g id="grid"></g>
        <circle cx="17" cy="15" r="6" class="guide" />
        <circle cx="17" cy="15" r="2" class="guide" />
        <line x1="9" y1="23" x2="27" y2="23" class="guide" />
        <!-- Bar and arc as one path so no antialiasing seam shows where they meet. -->
        <path d="M9 9h8a6 6 0 0 1 6 6h-4a2 2 0 0 0-2-2h-4v10H9z" class="glyph" />
        <circle cx="20.5" cy="20.5" r="2.5" class="mark-point" />
        <g class="labels">
          <text x="7.6" y="16.4" text-anchor="end">bar</text>
          <text x="23.6" y="8.6">arc</text>
          <text x="23.8" y="21.3">point</text>
        </g>
      </svg>
    </figure>
  </main>
  <script>
    // Same construction grid as BrandHero's ConstructionMark.
    const g = document.getElementById('grid')
    const ns = 'http://www.w3.org/2000/svg'
    for (let n = 1; n < 32; n++) {
      for (const [x1, y1, x2, y2] of [[n, 0, n, 32], [0, n, 32, n]]) {
        const l = document.createElementNS(ns, 'line')
        Object.entries({ x1, y1, x2, y2 }).forEach(([k, v]) => l.setAttribute(k, v))
        l.setAttribute('class', n % 8 === 0 ? 'grid grid--major' : 'grid')
        g.appendChild(l)
      }
    }
  </script>
</body>
</html>
